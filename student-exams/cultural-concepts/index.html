<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cultural Concepts Interactive Exam</title>
<style>
:root{--b:#3157d5;--p:#7b4fd8;--i:#17324d;--bd:#d8e3f0;--ok:#e7f7ed;--no:#fdecec}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:linear-gradient(135deg,#edf5ff,#f8f0ff)}header{position:sticky;top:0;z-index:3;background:linear-gradient(90deg,var(--b),var(--p));color:white;padding:22px 14px;text-align:center;box-shadow:0 3px 10px #0002}header h1{margin:0 0 5px;font-size:1.7rem}main{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:white;border:1px solid var(--bd);border-radius:15px;padding:20px;margin:16px 0;box-shadow:0 4px 15px #2342}.q h3{line-height:1.4}.opt{display:flex;gap:10px;padding:11px 13px;margin:8px 0;border:1px solid var(--bd);border-radius:11px;background:#fbfdff;cursor:pointer}.opt:hover{background:#f1f5ff;border-color:#93a8ff}.opt input{margin-top:3px}.fb{display:none;margin-top:12px;padding:13px;border-radius:10px;line-height:1.45}.fb.ok{display:block;background:var(--ok);border:1px solid #8dcea1}.fb.no{display:block;background:var(--no);border:1px solid #e4a1a1}.controls{text-align:center;margin:28px 0}.controls button{border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer}.submit{background:linear-gradient(90deg,var(--b),var(--p));color:#fff}.reset{background:#e8eef7;color:var(--i);margin-left:8px}.result{display:none;text-align:center;border:2px solid var(--b)}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--bd);padding:9px;text-align:center}th:first-child,td:first-child{text-align:left}.wrap{overflow:auto}.grid{display:grid;gap:14px}select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;background:#fff}.tag{display:inline-block;background:#edf1ff;color:#3148ad;border-radius:999px;padding:5px 9px;font-size:.82rem;font-weight:700}@media(min-width:780px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><header><h1>Cultural Concepts Interactive Exam</h1><div>Select the best answer unless the item asks you to select all that apply.</div></header><main>
<section class="card"><span class="tag">Student Instructions</span><p>Complete every item, then select <b>Submit Exam</b>. Your score and rationales will appear only after submission.</p><p>NGN-style items may require multiple responses.</p></section>
<div id="exam"></div><div class="controls"><button class="submit" onclick="grade()">Submit Exam</button><button class="reset" onclick="location.reload()">Reset</button></div><section id="result" class="card result"></section></main>
<script>const Q=[{"t":"mcq","s":"Which statement best explains how culture develops?","o":["It is learned through language, social interaction, and shared experiences.","It is inherited genetically through racial background.","It is determined by physical characteristics.","It develops only when people adapt to illness."],"a":[0],"r":"Culture is learned through language, socialization, values, beliefs, roles, customs, and shared experiences. It is not biologically or genetically inherited."},{"t":"mcq","s":"Which statement reflects a major characteristic of culture?","o":["Culture remains unchanged over time.","Members of a culture must have similar physical traits.","Culture adapts to environmental, technological, and resource conditions.","Members of a culture always share one religion and geographic origin."],"a":[2],"r":"Culture is learned, shared, dynamic, and able to adapt to environmental and technological conditions and available resources."},{"t":"mcq","s":"A group's shared knowledge, beliefs, customs, values, and skills are collectively described as:","o":["Norms","Culture","Ethnicity","Assimilation"],"a":[1],"r":"Culture includes the learned knowledge, beliefs, customs, values, roles, norms, and skills shared by members of a society."},{"t":"mcq","s":"Which statement best describes a subculture?","o":["A group that has completely adopted the dominant culture","A smaller group within a larger culture that shares distinct beliefs, values, or practices","A group defined only by unequal treatment","A group that refuses any association with the larger culture"],"a":[1],"r":"Subcultures are groups within a larger culture whose members share characteristics or beliefs that are not common to all members of the larger culture."},{"t":"mcq","s":"Which population is identified in the source nursing material as the largest and fastest-growing ethnic population in the United States?","o":["Asian Americans","Hispanic or Latino Americans","American Indians","African Americans"],"a":[1],"r":"The source material identifies Hispanic or Latino Americans as the largest and fastest-growing ethnic population in the United States."},{"t":"mcq","s":"During an assessment, a patient is touching a small object worn on a cord around the neck. What is the nurse's best response?","o":["Ask the patient what the object means to them.","Tell the patient to place it in the hospital safe.","Ask the family to take it home.","Ignore the item because it is not medically relevant."],"a":[0],"r":"The nurse should respectfully ask about unfamiliar cultural or spiritual practices to understand their meaning without judgment."},{"t":"mcq","s":"Which statement best describes ethnicity?","o":["It refers to a social group that may share traits such as language, religion, traditions, and geographic origin.","It means a person's belief in a higher power.","It is always changing because of technology.","It is learned only through childhood socialization."],"a":[0],"r":"Ethnicity refers to a social group that may share characteristics such as geographic origin, religion, language, traditions, values, or food preferences."},{"t":"mcq","s":"Which statement best reflects spirituality?","o":["Worship of a specific deity","Membership in an organized religion","A connection with something larger than oneself and a sense of transcendence","Shared ethnic customs passed down within families"],"a":[2],"r":"Spirituality is a broad concept involving meaning, purpose, connection, and transcendence and does not require organized religion."},{"t":"mcq","s":"A person immigrates to the United States, adopts the dominant language, dress, and customs, and no longer identifies strongly with the original culture. Which concept is illustrated?","o":["Integration","Assimilation","Biculturalism","Heritage consistency"],"a":[1],"r":"Assimilation occurs when a person adopts the dominant culture and may gradually lose aspects of the original cultural identity."},{"t":"mcq","s":"Which question is most useful when assessing a patient's cultural heritage?","o":["Do you use tobacco?","What religion do you practice?","How long have you lived in the United States?","Have you ever had heart disease?"],"a":[2],"r":"Questions about ancestry, place of origin, immigration history, and length of residence in the United States help assess heritage."},{"t":"mcq","s":"Which illness belief system includes the idea that microorganisms such as bacteria and viruses cause specific diseases?","o":["Holistic","Biomedical","Naturalistic","Magicoreligious"],"a":[1],"r":"The biomedical model includes germ theory, which attributes disease to microorganisms and other scientifically identifiable causes."},{"t":"mcq","s":"A patient who follows yin-yang beliefs considers diarrhea a 'cold' condition. Which treatment might the patient choose?","o":["Foods considered hot or yang","Foods considered colder or more yin","No treatment because balance cannot be restored","Only spiritual meditation"],"a":[0],"r":"In yin-yang theory, balance may be restored by using an opposite quality; a cold or yin condition may be treated with hot or yang foods or remedies."},{"t":"mcq","s":"According to yin-yang philosophy, health is best described as:","o":["The ability to work productively","Feeling emotionally stable","Balance among all aspects of the person","The ability to meet social obligations"],"a":[2],"r":"Health in yin-yang philosophy is associated with harmony and balance among opposing but complementary forces."},{"t":"mcq","s":"Which theory explains illness as resulting from disharmony or imbalance in natural forces?","o":["Germ theory","Naturalistic theory","Magicoreligious theory","Biomedical theory"],"a":[1],"r":"The naturalistic perspective views health as balance with nature; illness occurs when that balance is disrupted."},{"t":"mcq","s":"A patient believes illness is caused by supernatural forces. Which theory does this belief represent?","o":["Biomedical","Magicoreligious","Hot-cold","Developmental"],"a":[1],"r":"The magicoreligious perspective attributes health and illness to supernatural forces, spiritual powers, or divine influence."},{"t":"mcq","s":"A nurse is caring for an American Indian patient who uses prescribed diabetes treatment. Which additional practice should the nurse recognize as possible?","o":["The patient may also seek care from a traditional healer.","The patient has rejected all naturalistic beliefs.","The patient will automatically follow all biomedical recommendations.","The patient is likely experiencing a spiritual crisis."],"a":[0],"r":"Patients may use traditional healing practices alongside biomedical care. The nurse should assess rather than assume or discourage such practices."},{"t":"mcq","s":"Which statement best defines spirituality?","o":["A search for one specific supreme being","An organized set of religious rules","A belief that everyone must accept an afterlife","A personal sense of meaning, connection, and transcendence"],"a":[3],"r":"Spirituality is broader than religion and focuses on meaning, purpose, connection, and transcendence."},{"t":"mcq","s":"When caring for a child from a different cultural background, what should the nurse recognize about spiritual needs?","o":["They are influenced by the child's developmental level and family environment.","They exactly mirror the beliefs of the parents.","They are rarely affected by family religion.","They should be addressed only after physical needs are resolved."],"a":[0],"r":"Children's spiritual needs vary with developmental stage and the religious or spiritual environment of the family."},{"t":"mcq","s":"A recent immigrant becomes anxious around visitors because of difficulty speaking English and unfamiliar social expectations. Which concept best describes this experience?","o":["Culture shock","Cultural taboo","Ethnocentrism","Assimilation"],"a":[0],"r":"Culture shock is disorientation or stress caused by unfamiliar values, behaviors, language, and social expectations in a different culture."},{"t":"mcq","s":"Which statement about self-treatment is accurate?","o":["It is not considered useful by health professionals.","It is usually ineffective.","It always costs less than professional care.","It is influenced by access to over-the-counter medications and health information."],"a":[3],"r":"Self-treatment is common and influenced by access to over-the-counter medications, health literacy, the internet, and other health information sources."},{"t":"mcq","s":"Which statement best describes the hot-cold theory of illness?","o":["Illness is caused only by supernatural forces.","Herbs are classified solely by their actual temperature.","Health depends on balancing the body through qualities such as heat, cold, dryness, and moisture.","Only diet is used to restore health."],"a":[2],"r":"Hot-cold theory focuses on restoring balance among body humors through qualities such as heat, cold, dryness, and moisture."},{"t":"mcq","s":"Which question best begins a culturally sensitive assessment with an older American Indian patient?","o":["Are you Christian?","Do you want a medicine man?","How often do you visit doctors?","What cultural or spiritual beliefs are important to you?"],"a":[3],"r":"Open-ended questions communicate respect and allow patients to describe beliefs and practices without assumptions."},{"t":"mcq","s":"Which situation is the best example of a cultural taboo affecting health care?","o":["Using prayer before seeking care","Believing illness can have spiritual meaning","Declining blood products because they are prohibited by one's beliefs","Believing a birth defect has moral meaning"],"a":[2],"r":"A cultural taboo is a practice or behavior that is prohibited or avoided within a cultural or religious belief system."},{"t":"mcq","s":"Groups defined by differences such as ethnicity, religion, occupation, age, or gender within a larger culture are called:","o":["Families","Cultures","Spiritual groups","Subcultures"],"a":[3],"r":"Subcultures are groups within a larger culture whose members share distinct characteristics, values, or practices."},{"t":"mcq","s":"Which concept refers to an organized system of beliefs about the cause, nature, and purpose of the universe?","o":["Culture","Religion","Ethnicity","Spirituality"],"a":[1],"r":"Religion is an organized system of shared beliefs, practices, rituals, and values related to ultimate meaning or the nature of the universe."},{"t":"mcq","s":"Which element belongs specifically in a cultural assessment?","o":["Family history","Chief complaint","Past surgeries","Health practices"],"a":[3],"r":"Cultural assessment includes health beliefs, health practices, values, communication patterns, family roles, and spiritual practices."},{"t":"sata","s":"Which questions are appropriate when assessing a patient's health beliefs and practices? Select all that apply.","o":["What does being healthy mean to you?","Does anyone in your family have cancer?","How do you describe illness?","What did your family do when you were sick as a child?","Have you had any operations?","What do you do to stay healthy?"],"a":[0,2,3,5],"r":"Health-belief questions explore definitions of health and illness, traditional practices, family influences, and personal strategies for maintaining health. Family disease history and surgeries belong elsewhere in the health history."},{"t":"matrix","s":"A nurse is preparing a plan of care for a patient who uses both prescribed medication and a traditional herbal remedy. For each nursing action, identify whether it is appropriate or inappropriate.","rows":[["Ask the patient what the remedy is used for and how it is prepared.","Appropriate"],["Tell the patient to stop the remedy immediately because it is not biomedical.","Inappropriate"],["Assess for possible interactions with prescribed medications.","Appropriate"],["Document the practice and include it in the care discussion.","Appropriate"],["Avoid discussing the practice so the patient does not feel judged.","Inappropriate"]],"r":"Culturally responsive care requires respectful assessment, safety screening, documentation, and collaborative discussion. The nurse should not dismiss or ignore traditional practices."},{"t":"bowtie","s":"A recently immigrated patient becomes withdrawn, avoids visitors, and says, 'I feel lost because everything here is different.' Complete the bow-tie by identifying the most likely condition, two nursing actions, and two findings to monitor.","co":["Culture shock","Assimilation","Magicoreligious belief","Hot-cold imbalance"],"ca":"Culture shock","ao":["Use open-ended questions about the patient's experience","Encourage use of familiar cultural supports","Insist the patient adopt local customs quickly","Avoid discussing cultural concerns"],"aa":[0,1],"mo":["Anxiety level","Social withdrawal","Serum potassium","Visual acuity"],"ma":[0,1],"r":"Culture shock can present as disorientation, anxiety, and withdrawal. Nursing care should include supportive communication and culturally familiar supports while monitoring emotional and social adaptation."},{"t":"sata","s":"A nurse is conducting a cultural assessment for a patient admitted with a new chronic illness. Which assessment questions are most appropriate? Select all that apply.","o":["What do you believe caused this illness?","What treatments do you usually use when you are sick?","Are there foods or practices you avoid for cultural or spiritual reasons?","Which family members should be involved in health decisions?","Why don't you follow standard medical practices?","Do you have beliefs that could affect your care?"],"a":[0,1,2,3,5],"r":"Cultural assessment should be respectful, open-ended, and nonjudgmental. Questions about illness beliefs, treatments, dietary practices, family decision making, and care preferences are appropriate."},{"t":"matrix","s":"A patient says illness occurs when natural forces are out of balance and prefers remedies that restore harmony. Classify each statement as consistent or not consistent with this health belief.","rows":[["Health depends on maintaining balance with nature.","Consistent"],["Disease is always caused by microorganisms.","Not consistent"],["Opposing qualities such as hot and cold may be used to restore balance.","Consistent"],["Supernatural beings are the only cause of disease.","Not consistent"],["Food and remedies may be chosen according to balancing properties.","Consistent"]],"r":"Naturalistic models emphasize harmony and balance with nature. Hot-cold or yin-yang practices may be used to restore balance. Germ theory and exclusively supernatural explanations reflect other models."},{"t":"sata","s":"A patient declines a recommended blood transfusion because receiving blood conflicts with deeply held religious beliefs. The patient is alert, has decision-making capacity, and understands the risks. Which nursing actions are appropriate? Select all that apply.","o":["Notify the provider and document the patient's informed refusal.","Ask about acceptable alternatives that align with the patient's beliefs.","Pressure the patient to accept the transfusion because it is medically indicated.","Clarify the patient's preferences without criticizing the belief.","Arrange treatment options that respect the patient's informed decision when possible.","Tell the family they must convince the patient to accept the transfusion."],"a":[0,1,3,4],"r":"A competent patient has the right to refuse treatment. The nurse should support informed decision making, explore acceptable alternatives, document the refusal, and avoid coercion."}];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const eq=(a,b)=>JSON.stringify([...a].map(Number).sort((x,y)=>x-y))===JSON.stringify([...b].map(Number).sort((x,y)=>x-y));
function render(q,i){let id="q"+i,h='<section class="card q"><h3>'+esc(q.s)+'</h3>';
if(q.t==="mcq"||q.t==="sata"){h+=q.o.map((x,j)=>'<label class="opt"><input type="'+(q.t==="mcq"?"radio":"checkbox")+'" name="'+id+'" value="'+j+'"><span>'+esc(x)+'</span></label>').join("")}
else if(q.t==="matrix"){let a=q.rows[0][1]==="Appropriate"?["Appropriate","Inappropriate"]:["Consistent","Not consistent"];h+='<div class="wrap"><table><tr><th>Statement</th><th>'+a[0]+'</th><th>'+a[1]+'</th></tr>'+q.rows.map((x,j)=>'<tr><td>'+esc(x[0])+'</td><td><input type="radio" name="'+id+'r'+j+'" value="'+a[0]+'"></td><td><input type="radio" name="'+id+'r'+j+'" value="'+a[1]+'"></td></tr>').join("")+'</table></div>'}
else{h+='<div class="grid"><div><h4>Most likely condition</h4><select id="'+id+'c"><option value="">Choose...</option>'+q.co.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></div><div><h4>Choose two nursing actions</h4>'+q.ao.map((x,j)=>'<label class="opt"><input type="checkbox" name="'+id+'a" value="'+j+'"><span>'+esc(x)+'</span></label>').join("")+'</div><div><h4>Choose two findings to monitor</h4>'+q.mo.map((x,j)=>'<label class="opt"><input type="checkbox" name="'+id+'m" value="'+j+'"><span>'+esc(x)+'</span></label>').join("")+'</div></div>'}
return h+'<div id="'+id+'f" class="fb"></div></section>'}
document.getElementById("exam").innerHTML=Q.map(render).join("");
function grade(){let score=0;Q.forEach((q,i)=>{let id="q"+i,ok=false,d="";
if(q.t==="mcq"){let x=document.querySelector('input[name="'+id+'"]:checked');ok=!!x&&+x.value===q.a[0];d="Correct answer: "+q.o[q.a[0]]}
else if(q.t==="sata"){let x=[...document.querySelectorAll('input[name="'+id+'"]:checked')].map(e=>+e.value);ok=eq(x,q.a);d="Correct selections: "+q.a.map(j=>q.o[j]).join(" • ")}
else if(q.t==="matrix"){ok=true;let z=[];q.rows.forEach((x,j)=>{let s=document.querySelector('input[name="'+id+'r'+j+'"]:checked');if(!s||s.value!==x[1])ok=false;z.push(x[0]+" → "+x[1])});d="Correct classifications: "+z.join(" | ")}
else{let c=document.getElementById(id+"c").value,a=[...document.querySelectorAll('input[name="'+id+'a"]:checked')].map(e=>+e.value),m=[...document.querySelectorAll('input[name="'+id+'m"]:checked')].map(e=>+e.value);ok=c===q.ca&&eq(a,q.aa)&&eq(m,q.ma);d="Condition: "+q.ca+" | Actions: "+q.aa.map(j=>q.ao[j]).join(" • ")+" | Monitor: "+q.ma.map(j=>q.mo[j]).join(" • ")}
if(ok)score++;let f=document.getElementById(id+"f");f.className="fb "+(ok?"ok":"no");f.innerHTML="<b>"+(ok?"Correct":"Review this item")+"</b><br>"+esc(d)+"<br><br><b>Rationale:</b> "+esc(q.r)});
let p=Math.round(score/Q.length*100),r=document.getElementById("result");r.style.display="block";r.innerHTML="<h2>Score: "+score+" / "+Q.length+" ("+p+"%)</h2><p>Review the rationale beneath each item.</p>";r.scrollIntoView({behavior:"smooth",block:"center"})}
</script></body></html>
